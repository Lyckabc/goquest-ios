name: CI
on:
  push:
    branches: [main]
  pull_request:

# Bash `set -o pipefail` so xcodebuild errors aren't swallowed by xcpretty.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build:
    # macos-15 ships Xcode 16+ which matches XcodeGen 2.45+ project format (objectVersion=77).
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Goquest.xcodeproj \
            -scheme Goquest \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          xcodebuild \
            -project Goquest.xcodeproj \
            -scheme Goquest \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:GoquestUnitTests \
            CODE_SIGNING_ALLOWED=NO \
            test
