# Woodpecker CI — iOS (xcodegen + xcodebuild)
#
# Runs on the macOS self-hosted agent registered with the `platform=darwin/arm64`
# label. See `docs/woodpecker-mac-agent.md` for the agent setup runbook.
#
# Backend: `local` — each step runs as a shell command directly on the host.
# The `image:` field is required by the schema but ignored by the local backend.
#
# CODE_SIGNING_ALLOWED=NO so we don't need a code-signing identity in CI;
# the build still validates compilation + linking. Distribution archives
# (release lane) will need signing — separate pipeline.

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

labels:
  platform: darwin/arm64

steps:
  # ── 1. Regenerate xcodeproj (Goquest.xcodeproj/ is gitignored) ──
  - name: xcodegen
    image: bash
    commands:
      - xcodegen --version
      - xcodegen generate

  # ── 2. Build iOS app for Simulator (no signing) ──
  - name: build-ios
    image: bash
    commands:
      - xcodebuild -version
      - |
        xcodebuild \
          -project Goquest.xcodeproj \
          -scheme Goquest \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO \
          -skipPackagePluginValidation \
          build > /dev/null

  # ── 3. Build watchOS companion for Simulator (no signing) ──
  - name: build-watchos
    image: bash
    commands:
      - |
        xcodebuild \
          -project Goquest.xcodeproj \
          -scheme GoquestWatch \
          -sdk watchsimulator \
          -configuration Debug \
          -destination 'generic/platform=watchOS Simulator' \
          CODE_SIGNING_ALLOWED=NO \
          -skipPackagePluginValidation \
          build > /dev/null
