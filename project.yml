# XcodeGen project spec. Run `xcodegen generate` (brew install xcodegen) to
# materialise Goquest.xcodeproj. See README for setup steps.

name: Goquest
options:
  bundleIdPrefix: home.toji
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: ""             # Set in Xcode after first generate
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: 1.7.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2

targets:
  Goquest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Goquest
    resources:
      - path: Goquest/Resources
    info:
      path: Goquest/Info.plist
      properties:
        CFBundleDisplayName: Goquest
        UILaunchScreen:
          UIColorName: AccentColor
        # Lymphhub OIDC client id — inject via xcconfig (GOQUEST_OIDC_CLIENT_ID).
        # Empty/unset ⇒ AuthService falls back to the legacy ZITADEL client.
        GoquestOIDCClientID: $(GOQUEST_OIDC_CLIENT_ID)
        # OAuth callback URL scheme — must match the OIDC redirect URIs (double-slash form):
        # home.toji.goquest://oauth2redirect/lymphhub (Lymphhub) and .../zitadel (legacy fallback)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - home.toji.goquest
        # Background modes — `processing` + `fetch` together let
        # BGTaskScheduler wake the app for the calendar-sync refresh task.
        UIBackgroundModes:
          - processing
          - fetch
        # Identifiers below must match BGTaskScheduler.shared.register calls
        # in BackgroundCalendarSync.swift exactly.
        BGTaskSchedulerPermittedIdentifiers:
          - home.toji.goquest.calendar-sync
        NSCalendarsUsageDescription: >
          Goquest can sync ticket due dates to your iOS Calendar so you never
          miss a deadline.
        NSCalendarsFullAccessUsageDescription: >
          Goquest creates its own calendars (one per workspace) and never edits
          your existing events.
        NSUserNotificationsUsageDescription: >
          Goquest sends a notification when a ticket is assigned to you or a
          deadline is approaching.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: home.toji.goquest
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: AppAuth
      - package: KeychainAccess

  GoquestWatch:
    # watchOS companion app. The iPhone Goquest app pushes the OIDC
    # access_token over WatchConnectivity; this target uses it to call
    # the goquest-service REST API. Push notifications mirror from the
    # iPhone automatically once paired.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GoquestWatch
    resources:
      - path: GoquestWatch/Assets.xcassets
    info:
      path: GoquestWatch/Info.plist
      properties:
        CFBundleDisplayName: Goquest
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: home.toji.goquest
        UILaunchScreen:
          UIColorName: AccentColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: home.toji.goquest.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GoquestUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoquestUnitTests
    dependencies:
      - target: Goquest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: home.toji.goquest.UnitTests

  GoquestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoquestUITests
    dependencies:
      - target: Goquest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: home.toji.goquest.UITests
